[workspace]
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/engine",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.4", features = ["derive"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.18"
time = { version = "0.3.54", default-features = false, features = ["parsing"] }
tokio = { version = "1.49.0", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
