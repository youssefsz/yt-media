<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111416" />
    <link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
    <title>YT Media</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #0e1113;
        color-scheme: dark;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .startup-fallback {
        display: grid;
        width: 100vw;
        height: 100vh;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        background: #0e1113;
        color: #a9acae;
        font:
          0.9rem/1.4 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .startup-fallback-mark {
        display: grid;
        width: 4.25rem;
        height: 4.25rem;
        place-items: center;
      }

      .startup-fallback-logo {
        display: block;
        width: 100%;
        height: 100%;
        animation: startup-breathe 1.4s ease-in-out infinite;
      }

      @keyframes startup-breathe {
        0%,
        100% {
          transform: scale(0.975);
          opacity: 0.72;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-fallback-logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="startup-fallback" role="status" aria-live="polite">
        <span class="startup-fallback-mark" aria-hidden="true">
          <img class="startup-fallback-logo" src="/brand-mark.svg" alt="" />
        </span>
        <span>Starting YT Media</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
