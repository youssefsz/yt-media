[package]
name = "yt-media-engine"
description = "Headless media analysis and download engine for YT Media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
command-group.workspace = true
directories = "6.0.0"
fs2 = "0.4.3"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.24.0"

[features]
test-fixture = []

[[bin]]
name = "yt-media-process-fixture"
path = "tests/fixtures/process_fixture.rs"
required-features = ["test-fixture"]

[lints]
workspace = true
